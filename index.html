<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIN9 - Học Tin học 9</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px;
        }

        .menu {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.15);
        }

        button {
            background: #2563eb;
            color: white;

            border: none;
            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<header>

    <h1>💻 TIN9 - HỌC TIN HỌC 9</h1>

    <p>
        Học hiểu – Luyện tập – Lập trình – Chinh phục
    </p>

</header>


<div class="container">

    <h2>🎯 Khu vực học tập</h2>

    <div class="menu">

        <div class="card">

            <h2>📚</h2>

            <h3>Bài học</h3>

            <p>
                Học kiến thức Tin học 9
            </p>

            <button>
                Vào học
            </button>

        </div>


        <div class="card">

            <h2>📝</h2>

            <h3>Luyện tập</h3>

            <p>
                Làm bài tập và kiểm tra
            </p>

            <button>
                Làm bài
            </button>

        </div>


        <div class="card">

            <h2>💻</h2>

            <h3>Python</h3>

            <p>
                Học lập trình Python
            </p>

            <button>
                Lập trình
            </button>

        </div>


        <div class="card">

            <h2>🤖</h2>

            <h3>Trợ lý AI</h3>

            <p>
                Hỗ trợ học tập thông minh
            </p>

            <button>
                Hỏi AI
            </button>

        </div>

    </div>

</div>

</body>

</html>
